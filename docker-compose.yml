services:
  chat:
    image: matrixdotorg/synapse:v1.141.0
    container_name: chat
    restart: unless-stopped
    command: ["run"]
    ports:
      - "8008:8008"
    volumes:
      - chat_data:/data
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    container_name: chat-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chatpass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chat-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-admin
    restart: unless-stopped
    ports:
      - "3003:5173"
    volumes:
      - .:/app # Mount entire project for hot-reload
      # - ./node_modules:/app/node_modules
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
      WATCHPACK_POLLING: "true" # Better file watching for WSL
    depends_on:
      - chat
    stdin_open: true # Needed for some dev servers
    tty: true

volumes:
  chat_data:
  postgres_data:
